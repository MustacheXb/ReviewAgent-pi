# CI（#28）：零网络回归门。
#
# - suites：全量回归——root + review-llm 两包 typecheck + 测试（root 测试携带
#   golden bytes 等字节纪律断言）。#37 起 root test 同时覆盖只读 RunRecord
#   分析器（src/eval/analysis）与报告 schema golden——纯读、零网络 / 零 LLM，
#   边界守卫测试确保生产入口不 import 评测面（ADR-0016）。
# - DSH 内核（packages/review-dsh）已随「从 0 基于 pi 内核」方向移除（ADR-0009）；
#   其确定性纪律门曾在 pi 线以「对照 DSH 审计真源」形式重建（#5 P2
#   bytegate），并已随研究线退役（#32 / ADR-0014，E-only 生产化）——CI 不再
#   设对照门步骤。
# - review-llm（#41 起的 LLM 接入共享缝：resolver / profile / reviewer）进
#   suites：其 prepare 在 pnpm install 时构建 dist（onlyBuiltDependencies 放行），
#   编译路径运行时依赖该产物。
# - review-pi（#3 起的 pi 内核线 Review Runtime；#32 起唯一生产内核）进 suites：
#   typecheck 走包内 tsconfig（pi-ai 源码以 pi 基线 strict 级别进入程序），
#   测试经 vitest source 条件按 TS 源解析——两步均不依赖 pi dist。与 pi 四包
#   同约定：无 prepare、dist 构建显式执行（前置 pnpm build:pi）。#7 起 dist
#   前置构建进 CI：进程级烟测（src/cli/bin.process.test.ts）spawn 真 bin
#   （bin/review-pi.js → dist/cli/main.js），在位检查 + mtime 判鲜门要求全部
#   运行时产物腿在位且新鲜（测试内自愈构建兜底同源判鲜，正常路径 CI 先建好
#   即 no-op）。
#   注意：E 全链证明已随 #32 去守卫常开（合成 fixture 驱动，CI 上真跑）；
#   仍在 skipIf 守卫的面——真实 E 产物闭环（disposition/e-artifact，gitignored
#   runs/ 快照，CI 上自动跳过）。CI 绿不等于该面验收通过，全量证明以本地
#   实跑为准。
# - 真跑冒烟与真网关探针不进 CI（零网络纪律）：src/e2e/**/*.e2e.ts 独立入口
#   （pack 三形态 / server pack 冒烟，本地 test:e2e 复跑）；真网关 smoke 双探针
#   （review-pi smoke 子命令）与根 migration-gate 走本地按需执行。

name: CI

on:
  push:
    branches: [main, production/e-only] # ADR-0014：迁移期直推过 CI；收口重命名回 main 后 [main] 生效
  pull_request:

jobs:
  suites:
    name: suites (全量回归)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本单源：root package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist 前置构建（#7/#8）：vendored pi 四包 + review-llm + review-pi。
      # #7：进程级烟测 spawn 真 bin（在位检查 + mtime 判鲜门要求产物新鲜）；
      # #8：root typecheck 经根 tsconfig paths 消费 review-pi dist d.ts
      # （类型链），dist 必须先于 Typecheck (root) 在位。
      - name: Build dist (pi + review-llm + review-pi)
        run: |
          pnpm build:pi
          pnpm --filter review-llm build
          pnpm --filter review-pi build

      - name: Typecheck (root)
        run: pnpm typecheck

      # eval/bench（#39）：campaign 进程入口不在根 tsconfig include 内，单独
      # 编译检查，防入口类型漂移在 CI 绿灯下合入。
      - name: Typecheck (campaign entry)
        run: pnpm typecheck:campaign

      - name: Typecheck (review-llm)
        run: pnpm --filter review-llm typecheck

      - name: Typecheck (review-pi)
        run: pnpm --filter review-pi typecheck

      - name: Test (review-llm)
        run: pnpm --filter review-llm test

      - name: Test (review-pi)
        run: pnpm --filter review-pi test

      - name: Test (root)
        run: pnpm test
