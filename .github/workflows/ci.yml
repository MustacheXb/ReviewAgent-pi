# CI（#28）：零网络回归门。
#
# - suites：全量回归——root + review-llm 两包 typecheck + 测试（root 测试携带
#   golden bytes 等字节纪律断言）。
# - DSH 内核（packages/review-dsh）已随「从 0 基于 pi 内核」方向移除（ADR-0009）；
#   其确定性纪律门（discipline-gate）将由 pi 内核线 P2 票以「对照 DSH 审计真源」
#   的形式重建（见《Pi 内核从零实现方案》）。
# - review-llm（#41 起的 LLM 接入共享包；判定链仪器）进 suites：其 prepare 在
#   pnpm install 时构建 dist（onlyBuiltDependencies 放行），编译路径运行时依赖该产物。
# - review-pi（#3 起的 pi 内核线 Review Runtime）进 suites：typecheck 走包内
#   tsconfig（pi-ai 源码以 pi 基线 strict 级别进入程序），测试经 vitest source
#   条件按 TS 源解析——两步均不依赖 pi dist。与 pi 四包同约定：无 prepare、
#   dist 构建按需显式执行（前置 pnpm build:pi），不进 CI。
#   注意：两条重型验收证明（全链 E2E 与冻结 analyze 消费）skipIf 守卫
#   gitignored 本机数据（.cache 数据集快照 / runs 记录），CI 上自动跳过、
#   只跑快速子集——CI 绿不等于这两条验收通过，全量证明以本地实跑为准。
# - 真实 API 的指标对齐门（#29）走本地脚本按需执行，不进 CI。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    name: suites (全量回归)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本单源：root package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (review-llm)
        run: pnpm --filter review-llm typecheck

      - name: Typecheck (review-pi)
        run: pnpm --filter review-pi typecheck

      - name: Test (review-llm)
        run: pnpm --filter review-llm test

      - name: Test (review-pi)
        run: pnpm --filter review-pi test

      - name: Test (root)
        run: pnpm test
